github:
  per_page: 100
  max_pages: 3
  request_timeout_seconds: 30
  # Search queries are intentionally diverse. GitHub search is not exhaustive.
  code_queries:
    - 'filename:SKILL.md'
  repository_queries:
    - '"agent skills"'
    - '"SKILL.md"'
    - 'claude skills'
    - 'codex skills'
    - 'agent skill'

ranking:
  top_n: 20
  rising_min_history_days: 1

