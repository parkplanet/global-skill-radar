name: Daily Global Skill Radar

on:
  schedule:
    # 00:00 UTC = 08:00 Asia/Shanghai
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-global-skill-radar
  cancel-in-progress: false

jobs:
  collect-rank-report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect GitHub Skill candidates
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
        run: python scripts/collect_github_skills.py

      - name: Rank and compare snapshots
        run: python scripts/rank_skills.py

      - name: Classify candidates
        run: python scripts/classify_skills.py

      - name: Generate Chinese report
        run: python scripts/generate_report.py

      - name: Commit daily data and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data reports
          if ! git diff --cached --quiet; then
            git commit -m "chore: daily global skill radar $(date -u +%F)"
            git push
          else
            echo "No data changes to commit."
          fi
